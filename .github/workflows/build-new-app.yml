name: Build new-app APK

on:
  push:
    branches: [main]
    paths: ["new-app/**", ".github/workflows/build-new-app.yml"]
  pull_request:
    paths: ["new-app/**", ".github/workflows/build-new-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: new-app
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned)
        working-directory: new-app
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: new-app-debug
          path: new-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: new-app-release-unsigned
          path: new-app/app/build/outputs/apk/release/*.apk

